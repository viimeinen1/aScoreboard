# aScoreboard plugin configuration

# plugin command prefix
prefix: "<gold>[ac] </gold>"

# enable command
# if disabled, the plugin can only be accessed from the api
scoreboard-command: true

# How fast should the scoreboard update (in ticks)?
# Setting this too low may cause ping issues due to increased packets
scoreboard-update-speed: 20

# what scoreboard should be shown if nothing else is selected
# leave empty if no scoreboard should be shown by default
default-scoreboard: "exampleboard"

# scoreboards
# plugin provided placeholders: %name%, %players%
scoreboards:
  exampleboard:
    title: "<aqua>aScoreboard</aqua>"
    lines:
      - "a Scoreboard plugin"
      - "and a library"
      - ""
      - "author: viimeinen"
      - ""
      - "modify config to change the scoreboard"
      - ""
      - "%time_long%"
  secondary:
    title: "<red>aScoreboard</red>"
    lines:
      - ""
      - "- IGN: %name%"
      - "- players: %players%/69"
      - "- current time: %time_short%"
      - ""

# time format
# available with %time_<format>%, for example %time_short% and %time_long%
# use https://docs.oracle.com/javase/8/docs/api/java/text/SimpleDateFormat.html as a reference
timeformats:
  short: HH':'mm':'ss
  long: KK':'mm':'ss a MM/dd/yyyy

# timezone for time
timezone: "UTC"